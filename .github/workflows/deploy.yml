name: Deploy Production (OIDC + AWS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-release:
    uses: ./.github/workflows/ci-entrega.yml

  # -----------------------------------------------------------
  # 1. DESPLIEGUE DE FRONTENDS A S3 + CLOUDFRONT
  # -----------------------------------------------------------
  deploy-frontends:
    needs: validate-release
    name: Build & Deploy Frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build & Sync User Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          aws s3 sync ./dist s3://oamdevsol-restaurant-256663926988 --delete
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://backend.oamdevsol.site/api' }}

      - name: Build & Sync Admin Frontend
        working-directory: ./admin
        run: |
          npm ci
          npm run build
          aws s3 sync ./dist s3://oamdevsol-admin-256663926988 --delete
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://backend.oamdevsol.site/api' }}

      - name: Invalidate CloudFront Caches
        run: |
          echo "Invalidando CloudFront Frontend (E1K516ITL1YDZ3)..."
          aws cloudfront create-invalidation --distribution-id E1K516ITL1YDZ3 --paths "/*"
          echo "Invalidando CloudFront Admin (E1NK74NZM8UYXZ)..."
          aws cloudfront create-invalidation --distribution-id E1NK74NZM8UYXZ --paths "/*"

  # -----------------------------------------------------------
  # 2. DESPLIEGUE DEL BACKEND Y CONTENEDORES EC2 VÍA SSM
  # -----------------------------------------------------------
  deploy-backend:
    needs: validate-release
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Package Backend Bundle
        run: |
          zip -q -r backend_app.zip backend ml-service ai-engine db scripts compose.prod.yml package.json
          aws s3 cp backend_app.zip s3://oamdevsol-cfn-templates-256663926988/backend_app.zip

      - name: Execute Remote Deploy via AWS SSM
        run: |
          echo "Enviando comando de despliegue a la instancia EC2 i-000928567783f36af..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-000928567783f36af" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws s3 cp s3://oamdevsol-cfn-templates-256663926988/backend_app.zip /home/ubuntu/backend_app.zip --region us-east-1 && unzip -o /home/ubuntu/backend_app.zip -d /home/ubuntu/app && cd /home/ubuntu/app && sudo docker compose -f compose.prod.yml up -d --build backend ml-service ai-engine"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID generado: $COMMAND_ID"
          echo "Esperando que los contenedores se reconstruyan y levanten en la EC2..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-000928567783f36af"
          
          echo "Consultando estado final de la ejecución:"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-000928567783f36af" --query "Status" --output text
          echo "✅ Despliegue de Backend completado exitosamente en AWS EC2."
