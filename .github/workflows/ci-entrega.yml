name: Validación de liberación
on:
  workflow_call:
  push:
    branches: [codex/actividad-cicd]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias del motor ML
        run: python -m pip install -r ml-service/requirements.txt
      - name: Verificar código y pruebas de liberación
        run: bash scripts/ci/validate_release.sh
      - name: Construir frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Construir panel de administración
        working-directory: admin
        run: |
          npm ci
          npm run build
