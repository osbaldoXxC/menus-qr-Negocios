<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MexxicanMX - ¿Con quién comes?</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#dbe4ed",
                        "background": "#f6faff",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#e9f2fb",
                        "on-background": "#141d23",
                        "on-primary-fixed-variant": "#832600",
                        "secondary": "#5e5e5e",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "outline": "#8d7168",
                        "surface": "#f6faff",
                        "surface-dim": "#d2dbe4",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#ffdbd0",
                        "inverse-surface": "#293138",
                        "tertiary-fixed-dim": "#c5c7c8",
                        "on-primary-fixed": "#390c00",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#989a9b",
                        "on-secondary-fixed-variant": "#474747",
                        "on-primary-container": "#5f1900",
                        "inverse-primary": "#ffb59d",
                        "on-tertiary-fixed-variant": "#454748",
                        "surface-container-low": "#ecf5fe",
                        "on-tertiary-container": "#2f3233",
                        "error": "#ba1a1a",
                        "outline-variant": "#e1bfb5",
                        "on-secondary-container": "#646464",
                        "primary-container": "#ff6b35",
                        "surface-container": "#e6eff8",
                        "surface-container-highest": "#dbe4ed",
                        "surface-tint": "#ab3500",
                        "on-surface-variant": "#594139",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1a1a1a",
                        "secondary-container": "#e2e2e2",
                        "secondary-fixed": "#e2e2e2",
                        "primary-fixed-dim": "#ffb59d",
                        "tertiary-fixed": "#e1e3e4",
                        "on-tertiary-fixed": "#191c1d",
                        "secondary-fixed-dim": "#c6c6c6",
                        "primary": "#ab3500",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#1b1b1b",
                        "surface-container-high": "#e0e9f2",
                        "surface-bright": "#f6faff",
                        "tertiary": "#5c5f60"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-md": "1.5rem",
                        "pill-padding-y": "0.75rem",
                        "pill-padding-x": "1.25rem",
                        "grid-gutter": "1rem",
                        "stack-gap-lg": "2.5rem",
                        "container-padding": "2rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "label-sm": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "500" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "800" }]
                    },
                    "boxShadow": {
                        "ambient": "0px 10px 30px rgba(255, 107, 53, 0.08)",
                        "xl": "0 20px 40px rgba(0,0,0,0.08)"
                    }
                }
            }
        }
    </script>
<style>
        body {
            background: linear-gradient(135deg, #fffaf5 0%, #ffece3 100%);
            min-height: 100vh;
        }
        .icon-thin {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-container-padding text-on-surface">
<!-- Main Container -->
<main class="w-full max-w-[560px] mx-auto flex flex-col gap-stack-gap-lg">
<!-- Progress Bar -->
<div class="w-full flex flex-col gap-2 mb-4">
<div class="flex justify-between items-center px-1">
<span class="font-label-sm text-label-sm text-secondary">Paso 4 de 4</span>
</div>
<div class="w-full h-1.5 bg-secondary-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full transition-all duration-700 ease-in-out w-full"></div>
</div>
</div>
<!-- Onboarding Card -->
<div class="bg-surface-container-lowest rounded-[24px] shadow-xl p-8 md:p-10 flex flex-col gap-stack-gap-lg relative overflow-hidden">
<!-- Header -->
<div class="text-center flex flex-col gap-3">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-[#1a1a1a]">¿Con quién comes?</h1>
<p class="font-body-md text-body-md text-[#666666] max-w-sm mx-auto">Así la IA ajusta las recomendaciones para porciones y ambiente.</p>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-2 gap-grid-gutter">
<!-- Option: Solo (Selected) -->
<button class="flex flex-col items-center justify-center gap-4 p-6 rounded-[16px] bg-primary-container/10 border border-primary-container text-[#1a1a1a] transition-transform shadow-[0_4px_12px_rgba(255,107,53,0.15)] group">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] icon-thin text-primary-container" data-icon="person">person</span>
</div>
<span class="font-label-sm text-label-sm">Solo</span>
</button>
<!-- Option: Pareja -->
<button class="flex flex-col items-center justify-center gap-4 p-6 rounded-[16px] bg-surface-container-lowest border border-secondary-container text-[#1a1a1a] transition-all hover:border-primary-container/30 hover:bg-surface-container-low group">
<div class="w-12 h-12 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] icon-thin text-[#2d2d2d]" data-icon="favorite">favorite</span>
</div>
<span class="font-label-sm text-label-sm">En pareja</span>
</button>
<!-- Option: Familia -->
<button class="flex flex-col items-center justify-center gap-4 p-6 rounded-[16px] bg-surface-container-lowest border border-secondary-container text-[#1a1a1a] transition-all hover:border-primary-container/30 hover:bg-surface-container-low group">
<div class="w-12 h-12 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] icon-thin text-[#2d2d2d]" data-icon="family_restroom">family_restroom</span>
</div>
<span class="font-label-sm text-label-sm">Familia</span>
</button>
<!-- Option: Amigos -->
<button class="flex flex-col items-center justify-center gap-4 p-6 rounded-[16px] bg-surface-container-lowest border border-secondary-container text-[#1a1a1a] transition-all hover:border-primary-container/30 hover:bg-surface-container-low group">
<div class="w-12 h-12 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] icon-thin text-[#2d2d2d]" data-icon="groups">groups</span>
</div>
<span class="font-label-sm text-label-sm">Con amigos</span>
</button>
</div>
<!-- Success Message -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-center gap-3 border border-surface-variant">
<span class="material-symbols-outlined text-primary-container" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="font-body-md text-body-md text-[#2d2d2d]">¡Todo listo! Tu motor de recomendaciones te espera.</p>
</div>
<!-- Actions -->
<div class="flex gap-4 mt-2">
<button class="flex-1 py-pill-padding-y px-pill-padding-x rounded-[10px] border border-secondary-container bg-surface-container-lowest text-[#2d2d2d] font-label-sm text-label-sm hover:bg-surface-variant transition-colors flex items-center justify-center">
                    Atrás
                </button>
<button class="flex-[2] py-pill-padding-y px-pill-padding-x rounded-[10px] bg-primary-container text-on-primary font-label-sm text-label-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20">
                    Descubrir platillos
                    <span class="material-symbols-outlined text-[18px]" data-icon="rocket_launch">rocket_launch</span>
</button>
</div>
</div>
</main>
</body></html>
