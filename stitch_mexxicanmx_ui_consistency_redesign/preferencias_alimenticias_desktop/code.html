<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MexxicanMX - Preferencias Alimenticias</title>
<!-- Google Fonts & Material Symbols -->

<style>
        /* Custom styles to handle radio button states without complex JS */
        .diet-option input:checked + div {
            border-color: #ff6b35; /* primary */
            background-color: rgba(255, 107, 53, 0.08);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.05);
        }
        .diet-option input:checked + div .icon-wrapper {
            background-color: rgba(255, 107, 53, 0.1);
            color: #ff6b35;
            border-color: transparent;
        }
        .diet-option input:checked + div .check-icon {
            display: block;
            color: #ff6b35;
        }
        .diet-option input:checked + div .empty-circle {
            display: none;
        }
        
        .diet-option input:not(:checked) + div:hover {
            background-color: #fcfcfc;
        }
        .check-icon {
            display: none;
        }
        
        /* Subtle animated gradient background matching Dumplings card */
        .bg-animated-gradient {
            background: linear-gradient(135deg, #fdfbf7 0%, #fff6f2 100%);
        }
    </style>
</head>
<body class="bg-animated-gradient text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary selection:text-white relative">
<!-- Progress Bar (Anchored Top) -->
<div class="fixed top-0 left-0 w-full h-1.5 bg-secondary-fixed z-50">
<div class="h-full bg-primary transition-all duration-700 ease-in-out" style="width: 50%;"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-container-padding w-full relative z-10 pt-12 pb-12">
<!-- Brand Anchor -->
<div class="text-center mb-stack-gap-md">
<h2 class="font-display-lg text-display-lg text-[#1a1a1a] tracking-tight">MexxicanMX</h2>
</div>
<!-- Central Modal Card -->
<div class="w-full max-w-[560px] bg-white rounded-3xl p-stack-gap-lg shadow-[0_20px_40px_rgba(0,0,0,0.08)] flex flex-col border border-secondary-container">
<!-- Title -->
<div class="mb-stack-gap-lg text-center">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-2 block">Paso 2 de 4</span>
<h1 class="font-display-lg text-display-lg text-[#1a1a1a]">¿Sigues algún tipo de dieta?</h1>
</div>
<!-- Options Grid (1-column) -->
<div class="flex flex-col gap-4 flex-1">
<!-- Option 1: Sin restricciones (Pre-selected) -->
<label class="diet-option cursor-pointer relative group">
<input checked="" class="peer sr-only" name="diet" type="radio" value="none"/>
<div class="flex items-center gap-grid-gutter p-4 rounded-2xl border-2 border-secondary-fixed transition-all duration-200">
<!-- Icon -->
<div class="icon-wrapper w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 border border-secondary-fixed text-secondary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300, 'FILL' 0;">restaurant</span>
</div>
<!-- Content -->
<div class="flex-1">
<h3 class="font-label-sm text-[16px] font-bold text-[#1a1a1a] mb-1 group-hover:text-[#2d2d2d] transition-colors">Sin restricciones</h3>
<p class="font-body-md text-[14px] text-secondary leading-snug">Disfruto de todos los ingredientes sin limitaciones.</p>
</div>
<!-- Indicator -->
<div class="shrink-0 ml-2">
<span class="check-icon material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="empty-circle w-6 h-6 rounded-full border-2 border-secondary-fixed"></div>
</div>
</div>
</label>
<!-- Option 2: Vegetariana -->
<label class="diet-option cursor-pointer relative group">
<input class="peer sr-only" name="diet" type="radio" value="vegetarian"/>
<div class="flex items-center gap-grid-gutter p-4 rounded-2xl border-2 border-secondary-fixed transition-all duration-200 bg-white">
<div class="icon-wrapper w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 border border-secondary-fixed text-secondary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300, 'FILL' 0;">eco</span>
</div>
<div class="flex-1">
<h3 class="font-label-sm text-[16px] font-bold text-[#1a1a1a] mb-1 group-hover:text-[#2d2d2d] transition-colors">Vegetariana</h3>
<p class="font-body-md text-[14px] text-secondary leading-snug">Sin carnes ni pescados, con opciones lácteas y huevo.</p>
</div>
<div class="shrink-0 ml-2">
<span class="check-icon material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="empty-circle w-6 h-6 rounded-full border-2 border-secondary-fixed group-hover:border-secondary transition-colors"></div>
</div>
</div>
</label>
<!-- Option 3: Vegana -->
<label class="diet-option cursor-pointer relative group">
<input class="peer sr-only" name="diet" type="radio" value="vegan"/>
<div class="flex items-center gap-grid-gutter p-4 rounded-2xl border-2 border-secondary-fixed transition-all duration-200 bg-white">
<div class="icon-wrapper w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 border border-secondary-fixed text-secondary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300, 'FILL' 0;">spa</span>
</div>
<div class="flex-1">
<h3 class="font-label-sm text-[16px] font-bold text-[#1a1a1a] mb-1 group-hover:text-[#2d2d2d] transition-colors">Vegana</h3>
<p class="font-body-md text-[14px] text-secondary leading-snug">Exclusivamente ingredientes de origen vegetal.</p>
</div>
<div class="shrink-0 ml-2">
<span class="check-icon material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="empty-circle w-6 h-6 rounded-full border-2 border-secondary-fixed group-hover:border-secondary transition-colors"></div>
</div>
</div>
</label>
<!-- Option 4: Sin gluten -->
<label class="diet-option cursor-pointer relative group">
<input class="peer sr-only" name="diet" type="radio" value="gluten_free"/>
<div class="flex items-center gap-grid-gutter p-4 rounded-2xl border-2 border-secondary-fixed transition-all duration-200 bg-white">
<div class="icon-wrapper w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 border border-secondary-fixed text-secondary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300, 'FILL' 0;">grain</span>
</div>
<div class="flex-1">
<h3 class="font-label-sm text-[16px] font-bold text-[#1a1a1a] mb-1 group-hover:text-[#2d2d2d] transition-colors">Sin gluten</h3>
<p class="font-body-md text-[14px] text-secondary leading-snug">Preparaciones seguras para celíacos o intolerantes.</p>
</div>
<div class="shrink-0 ml-2">
<span class="check-icon material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="empty-circle w-6 h-6 rounded-full border-2 border-secondary-fixed group-hover:border-secondary transition-colors"></div>
</div>
</div>
</label>
<!-- Option 5: Keto -->
<label class="diet-option cursor-pointer relative group">
<input class="peer sr-only" name="diet" type="radio" value="keto"/>
<div class="flex items-center gap-grid-gutter p-4 rounded-2xl border-2 border-secondary-fixed transition-all duration-200 bg-white">
<div class="icon-wrapper w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 border border-secondary-fixed text-secondary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300, 'FILL' 0;">egg_alt</span>
</div>
<div class="flex-1">
<h3 class="font-label-sm text-[16px] font-bold text-[#1a1a1a] mb-1 group-hover:text-[#2d2d2d] transition-colors">Keto</h3>
<p class="font-body-md text-[14px] text-secondary leading-snug">Dietas bajas en carbohidratos y altas en grasas.</p>
</div>
<div class="shrink-0 ml-2">
<span class="check-icon material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="empty-circle w-6 h-6 rounded-full border-2 border-secondary-fixed group-hover:border-secondary transition-colors"></div>
</div>
</div>
</label>
</div>
<!-- Action Buttons Footer -->
<div class="flex items-center gap-grid-gutter mt-stack-gap-lg pt-6 border-t border-secondary-container">
<!-- Secondary Button (Atrás) -->
<button class="w-1/3 px-pill-padding-x py-pill-padding-y rounded-full border border-secondary-container bg-white text-[#1a1a1a] font-label-sm text-label-sm hover:bg-gray-50 transition-colors flex justify-center items-center" type="button">
                    Atrás
                </button>
<!-- Primary Button (Continuar) -->
<button class="w-2/3 px-pill-padding-x py-pill-padding-y rounded-full bg-primary text-[#ffffff] font-label-sm text-label-sm hover:bg-primary/90 transition-colors flex justify-center items-center shadow-[0_4px_12px_rgba(255,107,53,0.3)] transform active:scale-[0.98]" type="button">
                    Continuar
                </button>
</div>
</div>
</main>
</body></html>
